version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: tericsoft-devops-app:latest
    container_name: tericsoft-web-app
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - APP_ENV=Production (Docker on AWS)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
